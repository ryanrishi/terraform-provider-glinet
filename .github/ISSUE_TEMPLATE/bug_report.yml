name: Bug report
description: Report a problem with the provider.
labels: [bug]
body:
  - type: input
    id: router-model
    attributes:
      label: Router model
      placeholder: GL-AXT1800
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      placeholder: 4.7.0
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Provider version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform or OpenTofu version
      description: The output of `terraform version` or `tofu version`.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: The HCL that causes the problem. Remove passwords and other secrets.
      render: hcl
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the error, or debug output from `TF_LOG=DEBUG`. Remove passwords and other secrets.
